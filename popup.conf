# popup.conf — 改完保存即热更新，不必重启。
# 长度默认 pt，时间默认毫秒。

# --- 右下角按压缩罩 ---

# 贴着屏幕右边缘的黑条宽度
sidePt = 3
# 贴着屏幕底边缘的黑条高度
bottomPt = 3
# 侧条与底条内侧相交处的圆角半径
cornerRadiusPt = 24
# 右侧黑条向上延伸的长度
sideLengthPt = 80
# 底部黑条向左延伸的长度
bottomLengthPt = 80
# 内侧平面接到过渡弧的正圆角（切线长度）
positiveRadiusPt = 8
# 过渡弧接到屏幕边缘的负圆角（切线长度）
negativeRadiusPt = 8
# 远端过渡段长度（平面 → 正圆角 → 负圆角 → 屏幕边）
taperLengthPt = 24
# 遮罩阴影半径
shadowRadiusPt = 3
# 遮罩阴影不透明度，0–1，用于黑底上仍能看见轮廓
shadowOpacity = 0.4
# 遮罩显示动画时长
appearMs = 75
# 遮罩消失动画时长
disappearMs = 120
# 侧/底交界圆角相对平面的动画加速，越大圆角越先到位
cornerSpeed = 2.2

# --- 玻璃气泡 ---

# 弹出后停留时长
bubbleHoldMs = 3000
# 从屏外飞入并放大的时长
bubbleAppearMs = 350
# 缩小并飞回屏外的时长
bubbleDisappearMs = 220
# 终点：气泡右缘相对 Dock 右缘的偏移（正值向右）
bubbleEndX = -30
# 终点：气泡底缘相对 Dock 上缘的偏移（正值向上）
bubbleEndY = 30
