# 右下角实体键遮罩（单位 pt）。改完保存即可，不必重启。
# 侧面 / 底面 = 内侧平面厚度。
# cornerRadiusPt = 侧面平面与底面平面相交的圆角。
# taperLengthPt = 远端过渡段长度（平面经正圆角、负圆角接到屏幕）。
# positiveRadiusPt / negativeRadiusPt = 过渡段两端的切线长度。

# appearMs / disappearMs = 显示、消失动画时长（毫秒）。

sidePt = 3
bottomPt = 3
cornerRadiusPt = 24
sideLengthPt = 80
bottomLengthPt = 80
positiveRadiusPt = 8
negativeRadiusPt = 8
taperLengthPt = 24
shadowRadiusPt = 3
shadowOpacity = 0.4
appearMs = 75
disappearMs = 120
cornerSpeed = 2.2
