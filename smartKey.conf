# smartKey.conf — 用户副本在 ~/Library/Application Support/smartKey/。改完保存即热更新，不必重启。
# 长度默认 pt，时间默认毫秒。

# --- 线控手势 ---

# 是否识别双击。0=关闭，单击抬起立即触发；1=开启，单击需等待 doubleClickMs
doubleClickEnabled = 0
# 单击判定窗口，仅在双击开启时使用
doubleClickMs = 450
# 长按触发时长
longPressMs = 450

# --- 设备插入与选择 ---

# 插入时遮罩动画总时长（含出现与消失）
insertionMaskDurationMs = 800
# 插入遮罩出现时长
insertionMaskAppearMs = 120
# 插入遮罩消失时长
insertionMaskDisappearMs = 200
# 插入后弹窗延迟，让遮罩先出现
insertionPopupDelayMs = 200
# 设备类型与音频输出选择共用的超时（弹窗和设置内一致）；类型使用当前焦点项，音频使用第一个可用输出。0 关闭倒计时自动选择；关闭/最小化设置仍立即执行超时选择
deviceChoiceTimeoutMs = 5000
# 音频输出切换超时
audioSwitchTimeoutMs = 3000
# HID 连接等待提示出现时长（超时后仍继续发现）
hidConnectionNoticeMs = 5000

# --- 右下角按压缩罩 ---

# 贴着屏幕右边缘的黑条宽度
sidePt = 5
# 贴着屏幕底边缘的黑条高度
bottomPt = 5
# 侧条与底条内侧相交处的圆角半径
cornerRadiusPt = 24
# 右侧黑条向上延伸的长度
sideLengthPt = 80
# 底部黑条向左延伸的长度
bottomLengthPt = 80
# 内侧平面接到过渡弧的正圆角（切线长度）
positiveRadiusPt = 24
# 过渡弧接到屏幕边缘的负圆角（切线长度）
negativeRadiusPt = 24
# 远端过渡段长度（平面 → 正圆角 → 负圆角 → 屏幕边）
taperLengthPt = 24
# 遮罩阴影半径
shadowRadiusPt = 3
# 遮罩阴影不透明度，0–1，用于黑底上仍能看见轮廓
shadowOpacity = 0.4
# 按下时遮罩显示动画时长
appearMs = 75
# 松开时遮罩消失动画时长
disappearMs = 120
# 侧/底交界圆角相对平面的动画加速，越大圆角越先到位
cornerSpeed = 2.2

# --- 玻璃气泡 ---

# 弹出后停留时长
bubbleHoldMs = 1000
# 从屏外飞入并放大的时长
bubbleAppearMs = 300
# 缩小并飞回屏外的时长
bubbleDisappearMs = 180
# 从上一次触发后允许再次触发的间隔。冷却期内的手势直接忽略
bubbleRetriggerMs = 20
# 终点：气泡右缘相对 Dock 右缘的偏移（正值向右）
bubbleEndX = -30
# 终点：气泡底缘相对 Dock 上缘的偏移（正值向上）
bubbleEndY = 24

# --- 配置窗口 ---

# 配置气泡相对内置屏可见区域右下角的边距
setupScreenMarginPt = 18
# 两步弹窗共用的面板宽度，与原设备类型选择页一致
setupChoiceWidthPt = 380
# 旧配置兼容项；音频页宽度现统一使用 setupChoiceWidthPt
setupOutputWidthPt = 480
# 音频设备表格高度
setupTableHeightPt = 174
# 配置气泡圆角
setupCornerRadiusPt = 22
